# Per-repo settings for cheatsheet-compile.sh; see its header.
# A block may use the imports the sheet's first block makes.
ASSUME_IMPORTS="glycin:glycin glib=glib:glib gobj=glib:gobject"
# What the sheet's blocks read without declaring.
PRELUDE='
import "glycin:glycin"
import "glycin:glycin_gtk4"
import "glib:glib"

err: ^glib.Error
bytes: ^glib.Bytes
frame: ^glycin.Frame
'
