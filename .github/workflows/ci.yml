# `make ci` is the whole gate: the same steps, in the same order.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The desk's layout: the Amber tree is the folder amber above the workspace, where make
    # init-siblings clones the sibling bindings siblings.txt names; the Makefile finds them in
    # AMBER_ROOT.
    env:
      AMBER_ROOT: ${{ github.workspace }}/../amber
    steps:
      - uses: actions/checkout@v5

      # The sibling bindings, public, so no token.
      - name: siblings
        run: make init-siblings

      # ols: true brings odinfmt, which make ci's format check calls.
      - uses: Hyperquader-Coders/setup-amber-odin@v1
        with:
          ols: true

      # The packages are the Makefile's DEPS list.
      - name: system packages
        run: sudo apt-get update && make init-packages APT_FLAGS=-y

      # glycin sandboxes its loaders with bubblewrap, which needs unprivileged user namespaces.
      # ubuntu-24.04 restricts them through AppArmor, so allow them for this job, then show
      # that bubblewrap can start so a refusal is visible in the log.
      - name: allow bubblewrap
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-user --ro-bind / / true && echo "bubblewrap: ok"

      - name: make ci
        run: make ci
